[package]
name = "kleos-install-gui"
version = "1.10.0"
edition = "2021"
rust-version.workspace = true
description = "Native GUI installer for Kleos"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "kleos-install-gui"
