[package]
name = "kleos-credd"
version = "1.10.0"
edition = "2021"
rust-version.workspace = true
description = "Credential management daemon for Kleos"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "kleos_credd"
path = "src/lib.rs"

[[bin]]
name = "kleos-credd"
path = "src/main.rs"

[dependencies]
kleos-lib = { path = "../kleos-lib", version = "1.10.0", features = ["sqlcipher", "piv"] }
kleos-cred = { path = "../kleos-cred", version = "1.10.0" }

# Web framework
axum.workspace = true
tower.workspace = true
tower-http.workspace = true

# Async
tokio.workspace = true

# HTTP client for proxy; futures for streaming the capped proxy body.
reqwest.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Utils
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
async-trait.workspace = true
nix = { version = "0.29", features = ["user"] }
rpassword = "7"
anyhow = "1"
hex = "0.4"
subtle = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
url.workspace = true

# ECDH bootstrap auth (Stage 2 of ECDH PIV port).
# p256 for ECDSA verify of client 9A signatures.
# hkdf for deriving the bearer-encryption key from the ECDH shared secret.
# aes-gcm for encrypting the bearer in transit. sha2 for HKDF.
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pem"] }
hkdf = "0.12"
aes-gcm = "0.10"
sha2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
reqwest.workspace = true
http-body-util = "0.1"
tower = { workspace = true, features = ["util"] }
hex = "0.4"
tempfile = { workspace = true }
