[package]
name = "kleos-sidecar"
version = "1.10.0"
edition = "2021"
rust-version.workspace = true
license = "PolyForm-Noncommercial-1.0.0"
description = "Agent session proxy with batched memory writes and local code-context retrieval"

[[bin]]
name = "kleos-sidecar"
path = "src/main.rs"

[dependencies]
agent-forge = { path = "../agent-forge", version = "1.10.0" }
kleos-lib = { path = "../kleos-lib", version = "1.10.0" }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
dirs = { workspace = true }
arc-swap = "1"
toml = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

[features]
# Enable PIV/YubiKey signing tier (passes through to kleos-lib/piv).
piv = ["kleos-lib/piv"]

[dev-dependencies]
tempfile = "3"
