[package]
name = "kleos-phylaxd"
version = "1.10.0"
edition = "2021"
rust-version.workspace = true
description = "Phylax credential authority daemon -- credd with agent security extensions"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "phylaxd"
path = "src/main.rs"

[dependencies]
kleos-lib = { path = "../kleos-lib", version = "1.10.0" }
kleos-cred = { path = "../kleos-cred", version = "1.10.0" }
kleos-credd = { path = "../kleos-credd", version = "1.10.0" }
kleos-phylax = { path = "../kleos-phylax", version = "1.10.0" }

axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
zeroize.workspace = true
anyhow = "1"
dirs.workspace = true
